name: End-to-end tests

# Runs the Playwright tests in e2e/ against a local Supabase started on the
# runner, as `npm run e2e:db` and `npm run test:e2e` do on a Mac (see
# e2e/README.md). It needs no secrets: local Supabase makes its own keys, and
# every email lands in its Mailpit inbox, so nothing reaches production or a
# real inbox. Pull requests that change only docs skip it.
on:
  pull_request:
    paths:
      - src/**
      - e2e/**
      - supabase/**
      - package.json
      - package-lock.json
      - next.config.ts
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - src/**
      - e2e/**
      - supabase/**
      - package.json
      - package-lock.json
      - next.config.ts
      - .github/workflows/e2e.yml
  workflow_dispatch:

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The version the tests were written against. Newer ones should work.
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      # Local Supabase listens on ports 54321 to 54329, which sit inside the
      # range Linux picks from for outgoing connections (32768 to 60999). While
      # the runner downloads Supabase's images, one of those connections can
      # hold a port just as a container tries to listen on it, and the start
      # fails with "address already in use". Moving outgoing connections to
      # 60000 and up keeps them out of the way.
      - name: Keep outgoing connections off local Supabase's ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"

      - name: Start local Supabase and run the migrations
        run: npm run e2e:db

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npm run test:e2e

      # Each failed test keeps a trace: open it with `npx playwright show-trace`.
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/e2e
          retention-days: 7
